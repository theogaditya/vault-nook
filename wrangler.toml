name = "vault"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "d83e98a9c585cc72e5115a3fd3923010"

# Static Assets (React Vite Frontend built to ./dist)
assets = { directory = "./dist", binding = "ASSETS" }

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "myvault-db"
database_id = "1bb56be5-4662-4594-aec4-22074f57c66b"
migrations_dir = "migrations"

# Cloudflare R2 Object Storage Bucket Binding
[[r2_buckets]]
binding = "MYVAULT_BUCKET"
bucket_name = "myvault"

[observability]
enabled = false
head_sampling_rate = 1   

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true

[triggers]
crons = ["0 */6 * * *"]
